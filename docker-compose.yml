services:
  checkout:
    build:
      context: .
      dockerfile: shopsim/checkout/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      INVENTORY_URL: http://inventory:8080
      PAYMENT_URL: http://payment:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    depends_on:
      inventory:
        condition: service_healthy
      payment:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 5s
  inventory:
    build:
      context: .
      dockerfile: shopsim/inventory/Dockerfile
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      REDIS_URL: redis://redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 5s
  payment:
    build:
      context: .
      dockerfile: shopsim/payment/Dockerfile
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      DATABASE_URL: postgres://shopsim:shopsim-local@postgres:5432/shopsim?sslmode=disable&connect_timeout=1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 5s
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shopsim
      POSTGRES_PASSWORD: shopsim-local
      POSTGRES_DB: shopsim
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./shopsim/payment/init.sql:/docker-entrypoint-initdb.d/001-payments.sql:ro
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopsim -d shopsim"]
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 10s
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 5s

  # Observability is deliberately absent from ShopSim depends_on/readiness.
  otel-collector:
    image: otel/opentelemetry-collector:0.160.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    environment:
      GOMEMLIMIT: 96MiB
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:13133:13133"
    mem_limit: 128m
    cpus: 0.5
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    command: ["--config=/etc/jaeger/config.yaml"]
    volumes:
      - ./observability/jaeger.yaml:/etc/jaeger/config.yaml:ro
    environment:
      GOMEMLIMIT: 192MiB
    ports:
      - "127.0.0.1:16686:16686"
    mem_limit: 256m
    cpus: 0.5

volumes:
  postgres-data:
  redis-data:
